[project]
name = "icloud-to-gphotos"
version = "0.1.0"
description = "Nightly one-way migration of iCloud Photos into Google Photos, with metadata preservation and verified deletion."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ankan" }]
dependencies = [
    "pyicloud>=2.6.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "typer>=0.16",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
keyring = ["keyring>=25.7", "keyrings.alt>=5.0.2"]

[project.scripts]
i2g = "icloud_to_gphotos.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_to_gphotos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=icloud_to_gphotos",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src/icloud_to_gphotos"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4", "PTH"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
